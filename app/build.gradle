plugins {
    id 'com.android.application'
}

android {
    namespace 'com.umar.ordergrabber'
    compileSdk 34

    defaultConfig {
        applicationId 'com.umar.ordergrabber'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        fixed {
            storeFile file('og.keystore')
            storePassword 'ordergrab'
            keyAlias 'og'
            keyPassword 'ordergrab'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
